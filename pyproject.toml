[build-system]
build-backend = "setuptools.build_meta"

requires = [
  "setuptools",
  "wheel",
]

[project]
name = "nunchaku-rocm"
description = "AMD ROCm/Triton fork of Nunchaku (SVDQuant) — adds a portable Triton kernel backend so quantized diffusion models run on AMD GPUs without the NVIDIA-only CUDA extension. Derivative of https://github.com/nunchaku-ai/nunchaku."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
urls.Upstream = "https://github.com/nunchaku-ai/nunchaku"
dependencies = [
  "accelerate>=1.9",
  "diffusers>=0.36",
  "einops",
  "huggingface-hub>=0.34",
  "peft>=0.17",
  "protobuf",
  "sentencepiece",
  "torchvision>=0.20",
  "transformers>=4.54",
]
optional-dependencies.ci = [
  "accelerate==1.9",
  "cache-dit==1.1.9",
  "controlnet-aux==0.0.10",
  "datasets==3.6",
  "diffusers==0.36",
  "huggingface-hub==0.34",
  "image-gen-aux @ git+https://github.com/asomoza/image_gen_aux.git@e08ae3d",
  "peft==0.17",
  "pytest==8.4.2",
  "pytest-rerunfailures==16.0.1",
  "torchmetrics==1.8",
  "transformers==4.55.2",
]

optional-dependencies.demo = [
  "controlnet-aux",
  "gradio==5.39",
  "image-gen-aux @ git+https://github.com/asomoza/image_gen_aux.git",
  "spaces",
]
optional-dependencies.dev = [
  "cache-dit>=1.1.9",
  "controlnet-aux",
  "datasets<4",
  "image-gen-aux @ git+https://github.com/asomoza/image_gen_aux.git",
  "pre-commit",
  "pytest",
  "pytest-rerunfailures",
  "torchmetrics",
]
optional-dependencies.docs = [
  "docutils<0.21",
  "furo",
  "graphviz",
  "ipykernel",
  "jupyter",
  "myst-parser",
  "nbsphinx",
  "sphinx",
  "sphinx-book-theme",
  "sphinx-copybutton",
  "sphinx-rtd-theme",
  "sphinx-tabs",
  "sphinxawesome-theme",
  "sphinxcontrib-mermaid",
  "sphinxext-rediraffe",
]
optional-dependencies.full = [
  "controlnet-aux",
  "image-gen-aux @ git+https://github.com/asomoza/image_gen_aux.git",
]

[tool.setuptools.packages.find]
include = [ "nunchaku" ]

[tool.black]
line-length = 120
target-version = [ 'py311' ]

[tool.ruff]
line-length = 120

[tool.isort]
profile = "black"
known_first_party = [ "nunchaku" ]
line_length = 120

[tool.doc8]
max-line-length = 120
ignore-path = [ "docs/_build" ]
ignore = [ "D000", "D001" ]

[tool.rstcheck]
ignore_directives = [ "tabs" ]
ignore_messages = [ "ERROR/3", "INFO/1" ]
